<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Image com Efeito Vidro</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url('MeuGatoPreferido.png') no-repeat center center;
            background-size: cover;
        }

        .glass-container {
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            padding: 20px;
            max-width: 80%;
            max-height: 80%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .glass-container img {
            object-fit: contain;
            max-width: 100%;
            max-height: 100%;
            border-radius: 15px;
        }
    </style>
</head>
<body>
    <div class="glass-container">
        <img src="MeuGatoPreferido.png" alt="Imagem com Efeito Vidro">
    </div>
</body>
</html>
